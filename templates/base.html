<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PhotoTune{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}PhotoTune — 写真・画像をかんたんに補正・ダウンロードできる無料Webツール。明るさ・コントラスト・シャープネスなどをリアルタイムで調整できます。{% endblock %}">
  <!-- OGP -->
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}PhotoTune — 画像補正ツール{% endblock %}">
  <meta property="og:description" content="{% block og_description %}写真・画像をかんたんに補正・ダウンロードできる無料Webツール。明るさ・コントラスト・シャープネスなどをリアルタイムで調整できます。{% endblock %}">
  <meta property="og:url" content="{% block og_url %}https://phototune.karineffort.com/{% endblock %}">
  <meta property="og:image" content="https://phototune.karineffort.com/static/ogp.png">
  <meta property="og:site_name" content="PhotoTune">
  <meta property="og:locale" content="ja_JP">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block tw_title %}PhotoTune — 画像補正ツール{% endblock %}">
  <meta name="twitter:description" content="{% block tw_description %}写真・画像をかんたんに補正・ダウンロードできる無料Webツール。{% endblock %}">
  <meta name="twitter:image" content="https://phototune.karineffort.com/static/ogp.png">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f4f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #e91e8c, #f48cbf);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(233,30,140,0.25);
    }
    .header-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .header-icon { flex-shrink: 0; }
    header .logo { font-size: 1.3rem; font-weight: bold; letter-spacing: 0.02em; }
    header .tagline { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
    header a { color: #fff; text-decoration: none; }

    main { flex: 1; }

    /* フッター */
    footer {
      background: #2c2c2c;
      color: #ccc;
      padding: 40px 24px 28px;
      margin-top: 60px;
      font-size: 0.85rem;
      text-align: center;
    }
    .footer-inner { max-width: 1100px; margin: 0 auto; }
    .footer-brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .footer-logo { color: #fff; font-size: 1.1rem; font-weight: bold; }
    .footer-tagline { color: #888; font-size: 0.8rem; margin-bottom: 24px; }
    .footer-links { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-bottom: 24px; }
    .footer-links a { color: #bbb; text-decoration: none; font-size: 0.85rem; }
    .footer-links a:hover { color: #f48cbf; }
    .footer-divider { border: none; border-top: 1px solid #444; margin-bottom: 20px; }
    .footer-copy { color: #666; font-size: 0.78rem; }

    /* レスポンシブ */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      header .logo { font-size: 1.1rem; }
      footer { padding: 32px 16px 20px; margin-top: 40px; }
      .footer-links { gap: 20px; }
      .page-content { margin: 24px 16px; padding: 28px 20px; }
    }

    /* 共通コンテンツ */
    .page-content { max-width: 800px; margin: 48px auto; padding: 40px 40px; background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    .page-content h1 { font-size: 1.4rem; color: #e91e8c; margin-bottom: 24px; }
    .page-content h2 { font-size: 1rem; margin: 28px 0 8px; color: #444; }
    .page-content p { line-height: 1.8; color: #555; margin-bottom: 8px; }
    .page-content ul { padding-left: 20px; color: #555; line-height: 1.9; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="header-brand">
      <svg class="header-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.2)"/>
        <!-- wand stick -->
        <line x1="8" y1="28" x2="22" y2="14" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <!-- wand tip star -->
        <polygon points="24,7 25.2,11.2 29.5,11.2 26,13.8 27.2,18 24,15.4 20.8,18 22,13.8 18.5,11.2 22.8,11.2" fill="white"/>
        <!-- sparkles -->
        <circle cx="10" cy="14" r="1.4" fill="white" opacity="0.9"/>
        <circle cx="14" cy="9" r="1" fill="white" opacity="0.7"/>
        <circle cx="30" cy="22" r="1.2" fill="white" opacity="0.8"/>
        <line x1="10" y1="11" x2="10" y2="17" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="7" y1="14" x2="13" y2="14" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="30" y1="19.5" x2="30" y2="24.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
        <line x1="27.5" y1="22" x2="32.5" y2="22" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <div>
        <div class="logo">PhotoTune</div>
        <div class="tagline">画像をかんたんに補正・ダウンロード</div>
      </div>
    </a>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.08)"/>
          <line x1="8" y1="28" x2="22" y2="14" stroke="#f48cbf" stroke-width="3" stroke-linecap="round"/>
          <polygon points="24,7 25.2,11.2 29.5,11.2 26,13.8 27.2,18 24,15.4 20.8,18 22,13.8 18.5,11.2 22.8,11.2" fill="#f48cbf"/>
          <circle cx="10" cy="14" r="1.4" fill="#f48cbf" opacity="0.8"/>
          <circle cx="14" cy="9" r="1" fill="#f48cbf" opacity="0.6"/>
          <circle cx="30" cy="22" r="1.2" fill="#f48cbf" opacity="0.7"/>
          <line x1="10" y1="11" x2="10" y2="17" stroke="#f48cbf" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
          <line x1="7" y1="14" x2="13" y2="14" stroke="#f48cbf" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
          <line x1="30" y1="19.5" x2="30" y2="24.5" stroke="#f48cbf" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
          <line x1="27.5" y1="22" x2="32.5" y2="22" stroke="#f48cbf" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <div class="footer-logo">PhotoTune</div>
      </div>
      <div class="footer-tagline">画像をかんたんに補正・ダウンロード</div>
      <div class="footer-links">
        <a href="/">ホーム</a>
        <a href="/contact">お問い合わせ</a>
        <a href="/privacy">プライバシーポリシー</a>
        <a href="/terms">利用規約</a>
      </div>
      <hr class="footer-divider">
      <div class="footer-copy">© 2026 PhotoTune. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
